<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keevault · Einstellungen</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="options.js"></script>
</head>
<body class="settings">
  <main>
    <header>
      <span class="eyebrow">Keevault</span>
      <h1>Erweiterung einrichten</h1>
    </header>
    <p>Gib die Startadresse deiner Keevault-Webanwendung ein. Der Browser fragt nach Zugriff auf diesen Host.</p>
    <form id="settings-form">
      <label for="vault-url">Keevault-Adresse</label>
      <input id="vault-url" type="url" inputmode="url" required autocomplete="off" spellcheck="false"
        placeholder="https://vault.example.com" aria-describedby="url-help">
      <p id="url-help">HTTPS oder lokales HTTP über localhost bzw. 127.0.0.1.</p>
      <button type="submit" class="primary" disabled>Speichern und Zugriff erlauben</button>
      <p id="status" role="status"></p>
    </form>
  </main>
</body>
</html>
