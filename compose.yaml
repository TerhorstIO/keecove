services:
  keevault:
    image: ghcr.io/terhorstio/keevault:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_ORIGIN: ""
      CLOUD_ONEDRIVE_CLIENT_ID: ""
      CLOUD_ONEDRIVE_TENANT: common
      CLOUD_GOOGLE_CLIENT_ID: ""
      CLOUD_DROPBOX_CLIENT_ID: ""
      EXTENSION_CHROME_URL: ""
      EXTENSION_EDGE_URL: ""
      EXTENSION_FIREFOX_URL: ""
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('node:http').get({ hostname: '127.0.0.1', port: process.env.PORT, path: '/healthz' }, response => {
            response.resume();
            process.exitCode = response.statusCode === 204 ? 0 : 1;
          }).on('error', () => { process.exitCode = 1; });
      interval: 30s
      timeout: 5s
      retries: 3
