name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/terhorstio/keevault

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Validate the Docker build
        if: github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 .

  publish:
    name: Publish image
    # Repository ID stays stable if TerhorstIO/keecove is renamed.
    if: github.event_name == 'push' && github.repository_id == '1450719010'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    name: Publish offline archives
    if: github.event_name == 'push' && github.repository_id == '1450719010'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export Docker images
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]

          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            manifest=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("expected one manifest for linux/" + $arch) end
            ' <<< "$index")
            docker pull --platform "linux/$arch" "$IMAGE@$manifest"
            docker image tag "$IMAGE@$manifest" "$IMAGE:$IMAGE_TAG"
            if [[ "$arch" == amd64 ]]; then
              (
                container=$(docker create --platform linux/amd64 "$IMAGE@$manifest")
                trap 'docker rm "$container" >/dev/null' EXIT
                docker cp "$container:/app/dist/keecove-browser.zip" .
                docker cp "$container:/app/dist/keecove-firefox.zip" .
              )
            fi
            docker image save --platform "linux/$arch" \
              --output "keecove-linux-$arch.tar" "$IMAGE:$IMAGE_TAG"
          done
          sha256sum keecove-linux-amd64.tar keecove-linux-arm64.tar \
            keecove-browser.zip keecove-firefox.zip > SHA256SUMS
      - name: Upload archives to GitHub Releases
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_flags=(--verify-tag)
          else
            release_tag="build-$GITHUB_SHA"
            release_flags=(--target "$GITHUB_SHA" --prerelease --latest=false)
          fi
          assets=(keecove-linux-amd64.tar keecove-linux-arm64.tar keecove-browser.zip keecove-firefox.zip SHA256SUMS)

          if is_draft=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            gh release upload "$release_tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$is_draft" == true ]]; then
              gh release edit "$release_tag" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$release_tag" "${assets[@]}" "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY" --title "KeeCove $release_tag" \
              --notes "Offline Docker archives and browser extension packages for $IMAGE:$IMAGE_TAG."
          fi
